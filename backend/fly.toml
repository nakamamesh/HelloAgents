# Deprecated — use repo-root fly.toml: `fly deploy` from HelloAgents/
# Kept so existing docs/scripts that `cd backend && fly deploy` fail loudly.
app = "helloagents-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  APP_NAME = "HelloAgents"
  OPENROUTER_MODEL = "deepseek/deepseek-v4-flash"
  OPENROUTER_BASE_URL = "https://openrouter.ai/api/v1"
  JWT_EXPIRES_MINUTES = "60"
  CORS_ORIGINS = "http://localhost:3000,http://127.0.0.1:3000"

[deploy]
  release_command = "alembic upgrade head"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
